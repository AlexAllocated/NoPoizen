name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lua: ['5.1', '5.2']
    defaults:
      run:
        working-directory: addon
    steps:
      - uses: actions/checkout@v4
        with:
          path: addon
      - uses: actions/checkout@v4
        with:
          repository: AlexAllocated/libchev
          ref: bd83b65fcbd21d108d8f6c02677acddb30541c6a
          path: library
      - run: sudo apt-get update && sudo apt-get install -y lua${{ matrix.lua }}
      - run: lua${{ matrix.lua }} scripts/test.lua
      - run: lua${{ matrix.lua }} scripts/test.lua . reverse
      - run: lua${{ matrix.lua }} scripts/smoke.lua . retail
      - run: lua${{ matrix.lua }} scripts/smoke.lua . forever
      - run: lua${{ matrix.lua }} scripts/smoke.lua . era
      - run: lua${{ matrix.lua }} scripts/smoke.lua . sod
      - run: lua${{ matrix.lua }} scripts/smoke.lua . tbc
      - run: lua${{ matrix.lua }} scripts/smoke.lua . mists
      - run: lua${{ matrix.lua }} scripts/smoke.lua . titan
      - run: python3 ../library/scripts/vendor.py . --check
      - run: python3 scripts/package.py --library-source ../library --output /tmp/NoPoizen.zip
      - run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - run: find . -name '*.lua' -exec luac${{ matrix.lua }} -p {} \;
      - run: bash -n scripts/bump_version.sh && git diff --check
